version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/demo"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-service
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:3000
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: always

networks:
  app-network:
    driver: bridge
